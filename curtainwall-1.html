<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gallery Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- GLightbox CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css"
    />

    <style>
      body {
        font-family: sans-serif;
        padding: 40px;
        background: #f8f8f8;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .gallery a {
        display: block;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .gallery img {
        width: 100%;
        display: block;
        transition: transform 0.3s ease;
      }

      .gallery a:hover img {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <h1>Image Gallery with Popup</h1>

    <div class="gallery">
      <a
        href="https://via.placeholder.com/1200x800"
        class="glightbox"
        data-gallery="gallery1"
      >
        <img src="https://via.placeholder.com/400x300" alt="Image 1" />
      </a>
      <a
        href="https://via.placeholder.com/1200x900"
        class="glightbox"
        data-gallery="gallery1"
      >
        <img src="https://via.placeholder.com/400x300" alt="Image 2" />
      </a>
      <a
        href="https://via.placeholder.com/1200x700"
        class="glightbox"
        data-gallery="gallery1"
      >
        <img src="https://via.placeholder.com/400x300" alt="Image 3" />
      </a>
    </div>

    <!-- GLightbox JS -->
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script>
      const lightbox = GLightbox({
        selector: ".glightbox",
      });
    </script>
  </body>
</html>
