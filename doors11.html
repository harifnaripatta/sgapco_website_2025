<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furniture Categories</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: "Inter", sans-serif;
        background: #f4f4f8;
      }

      .grid {
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(3, 1fr);
        max-width: 1200px;
        margin: auto;
      }

      .card {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        transition: transform 0.3s ease;
        display: block;
        text-decoration: none;
        color: inherit;
      }

      .card:hover {
        transform: translateY(-6px);
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.4s ease;
      }

      .card:hover img {
        transform: scale(1.05);
      }

      .overlay {
        position: absolute;
        bottom: 0;
        width: 100%;
        background: rgba(0, 0, 124, 0.7);
        color: white;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        transition: background 0.3s ease;
      }

      .overlay h3 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      .button {
        background: white;
        color: #00007c;
        padding: 6px 14px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 0.8rem;
        text-transform: uppercase;
        text-decoration: none;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .card:hover .button {
        opacity: 1;
      }

      @media (max-width: 500px) {
        .overlay {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }

        .button {
          align-self: flex-end;
        }
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <a href="office-furniture.html" class="card">
        <img
          src="https://images.unsplash.com/photo-1598300053655-69e9edcd8344?auto=format&fit=crop&w=800&q=80"
          alt="Office Furniture"
        />
        <div class="overlay">
          <h3>Office Furniture</h3>
          <div class="button">View More</div>
        </div>
      </a>

      <a href="wardrobes.html" class="card">
        <img
          src="https://cdn.pixabay.com/photo/2020/04/28/16/38/wardrobe-5103116_1280.jpg"
          alt="Wardrobes"
        />
        <div class="overlay">
          <h3>Wardrobes</h3>
          <div class="button">View More</div>
        </div>
      </a>

      <a href="sokap-partition.html" class="card">
        <img
          src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80"
          alt="Sokap Partition"
        />
        <div class="overlay">
          <h3>Sokap Partition</h3>
          <div class="button">View More</div>
        </div>
      </a>

      <a href="doors.html" class="card">
        <img
          src="https://cdn.pixabay.com/photo/2015/03/26/09/39/door-690204_1280.jpg"
          alt="Doors"
        />
        <div class="overlay">
          <h3>Doors</h3>
          <div class="button">View More</div>
        </div>
      </a>

      <a href="cubicles.html" class="card">
        <img
          src="https://cdn.pixabay.com/photo/2018/05/07/17/53/toilet-3386761_1280.jpg"
          alt="Cubicle Systems"
        />
        <div class="overlay">
          <h3>Cubicle Systems</h3>
          <div class="button">View More</div>
        </div>
      </a>

      <a href="kitchen-cabinet.html" class="card">
        <img
          src="https://cdn.pixabay.com/photo/2017/03/27/14/56/kitchen-2174593_1280.jpg"
          alt="Kitchen Cabinet"
        />
        <div class="overlay">
          <h3>Kitchen Cabinet</h3>
          <div class="button">View More</div>
        </div>
      </a>
    </div>
  </body>
</html>
